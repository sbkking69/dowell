<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AI Chat — Профнавигатор</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Inter", sans-serif;
      background: #000;
    }

    /* === CODE RAIN BACKGROUND === */
    #codeRain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 0;
      transition: background 0.3s;
    }

    /* === FLOATING CHAT CONTAINER === */
    .chat-container {
      position: relative;
      z-index: 2;
      width: 92%;
      max-width: 420px;
      height: 88vh;
      margin: auto;
      margin-top: 5vh;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    body.dark .chat-container {
      background: rgba(25, 25, 25, 0.92);
      color: #f1f5f9;
      box-shadow: 0 10px 35px rgba(0, 255, 100, 0.15);
    }

    /* HEADER */
    .chat-header {
      flex-shrink: 0;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }
    body.dark .chat-header {
      background: rgba(30, 30, 30, 0.85);
      border-color: #333;
    }

    /* CHAT BODY */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }
    .msg-user {
      background: #2563eb;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg-ai {
      background: #e5e7eb;
      color: #111827;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    body.dark .msg-ai {
      background: #374151;
      color: #f9fafb;
    }

    .chat-input {
      padding: 8px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border-top: 1px solid #e5e7eb;
    }
    body.dark .chat-input {
      background: rgba(30, 30, 30, 0.85);
      border-color: #333;
    }

    select.form-select, input.form-control {
      font-size: 0.85rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <canvas id="codeRain"></canvas>

  <div class="chat-container">
    <!-- HEADER -->
    <div class="chat-header">
      <div class="d-flex align-items-center gap-2">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" width="22" height="22">
        <span class="fw-semibold">@your_tg_nickname</span>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-primary rounded-pill" id="howBtn">?</button>
        <button class="btn btn-sm btn-outline-success rounded-pill" id="supportBtn">💬</button>
        <button class="btn btn-sm btn-outline-secondary rounded-pill" id="settingsBtn">⚙️</button>
      </div>
    </div>

    <!-- SELECTORS -->
    <div class="p-3 border-bottom bg-white bg-opacity-75">
      <label class="form-label mb-1 small text-secondary">Специалист</label>
      <select class="form-select mb-2" id="specialistSelect">
        <option>Карьерный консультант</option>
        <option>HR-эксперт</option>
        <option>Психолог</option>
        <option>Разработчик</option>
      </select>

      <label class="form-label mb-1 small text-secondary">Модель ИИ</label>
      <select class="form-select" id="modelSelect">
        <option>GPT-5</option>
        <option>Claude 3.5</option>
        <option>Gemini 1.5</option>
        <option>Mistral Large</option>
      </select>
    </div>

    <!-- CHAT -->
    <div class="chat-messages" id="chatBox">
      <div class="msg msg-ai">Привет! Я помогу тебе выбрать профессию. С кем хочешь поговорить сегодня?</div>
    </div>

    <!-- INPUT -->
    <div class="chat-input d-flex align-items-center">
      <input type="text" id="userInput" class="form-control rounded-pill me-2" placeholder="Сообщение...">
      <button id="sendBtn" class="btn btn-primary rounded-pill px-3">➤</button>
    </div>
  </div>

  <!-- MODALS -->
  <div class="modal fade" id="howModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header">
          <h5 class="modal-title">Как это работает</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body small text-secondary">
          1️⃣ Выберите специалиста и модель ИИ.<br>
          2️⃣ Напишите сообщение — получите ответ.<br>
          3️⃣ Можно менять специалиста без выхода из чата.
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary w-100" data-bs-dismiss="modal">Понятно</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="supportModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header">
          <h5 class="modal-title">Техподдержка</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body small text-secondary">
          Связаться с нами: <br> support@ai-chat.com
        </div>
        <div class="modal-footer">
          <button class="btn btn-success w-100" data-bs-dismiss="modal">Ок</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="settingsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header">
          <h5 class="modal-title">Настройки</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body small">
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="darkModeSwitch">
            <label class="form-check-label" for="darkModeSwitch">Тёмная тема</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="bgSwitch" checked>
            <label class="form-check-label" for="bgSwitch">Падающий фон (цифры)</label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const specialistSelect = document.getElementById('specialistSelect');
    const modelSelect = document.getElementById('modelSelect');
    const darkSwitch = document.getElementById('darkModeSwitch');
    const bgSwitch = document.getElementById('bgSwitch');
    const canvas = document.getElementById('codeRain');
    const ctx = canvas.getContext('2d');
    let codeRainEnabled = true;
    let darkMode = false;

    /* CHAT */
    function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      const msgUser = document.createElement('div');
      msgUser.className = 'msg msg-user';
      msgUser.textContent = text;
      chatBox.appendChild(msgUser);
      userInput.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        const msgAi = document.createElement('div');
        msgAi.className = 'msg msg-ai';
        msgAi.textContent = `(${specialistSelect.value}, ${modelSelect.value}): Понял тебя — вот что советую...`;
        chatBox.appendChild(msgAi);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 900);
    }

    sendBtn.onclick = sendMessage;
    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });

    document.getElementById('howBtn').onclick = () => new bootstrap.Modal('#howModal').show();
    document.getElementById('supportBtn').onclick = () => new bootstrap.Modal('#supportModal').show();
    document.getElementById('settingsBtn').onclick = () => new bootstrap.Modal('#settingsModal').show();

    darkSwitch.onchange = () => {
      darkMode = darkSwitch.checked;
      document.body.classList.toggle('dark', darkMode);
    };
    bgSwitch.onchange = () => {
      codeRainEnabled = bgSwitch.checked;
    };

    /* === CODE RAIN === */
    const letters = '01ABCDEF';
    let fontSize = 14;
    let columns, drops;

    function initRain() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.floor(canvas.width / fontSize);
      drops = Array(columns).fill(1);
    }

    function drawRain() {
      if (!codeRainEnabled) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        requestAnimationFrame(drawRain);
        return;
      }

      // Цвет зависит от темы
      const color = darkMode ? '#00ff80' : '#0a0a0a';
      const fade = darkMode ? 'rgba(0, 0, 0, 0.05)' : 'rgba(255, 255, 255, 0.1)';

      ctx.fillStyle = fade;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = color;
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      requestAnimationFrame(drawRain);
    }

    window.onload = () => {
      initRain();
      drawRain();
    };
    window.onresize = initRain;
  </script>
</body>
</html>
